<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="天水圍上水">
  <title>天水圍 ⇄ 上水</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#121820;color:#e8eef6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
    body{display:flex;flex-direction:column;padding:12px 14px 14px;gap:10px;height:100%}
    .top{background:#1c2533;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .title{font-size:1.25rem;font-weight:900;letter-spacing:0.3px}
    .sub{font-size:.72rem;color:#8fa3b8;margin-top:3px}
    .right{text-align:right}
    .clock{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
    .meta{font-size:.75rem;color:#7ec8ff;margin-top:3px}
    .body{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
    .section{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
    .sec-label{font-size:.78rem;font-weight:800;letter-spacing:1px;padding:0 2px;color:#9ad0ff;display:flex;align-items:center;gap:8px;flex-shrink:0}
    .sec-label.off{color:#f0b48a}
    .sec-label::after{content:"";flex:1;height:1px;background:rgba(140,170,210,0.12)}
    .cards{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
    .card{background:#1c2533;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;border-left:4px solid #e84a5f}
    .head{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;gap:10px}
    .route-left{display:flex;flex-direction:column;gap:3px}
    .route-row{display:flex;align-items:center;gap:8px}
    .badge{font-size:.6rem;font-weight:800;padding:3px 7px;border-radius:5px;background:#e84a5f;color:#fff}
    .rnum{font-size:1.45rem;font-weight:900;line-height:1;color:#ff6b7a}
    .terminus{font-size:.68rem;color:#8fa3b8}
    .fromto{font-size:.85rem;font-weight:700;color:#f2f6fc;text-align:right;line-height:1.3}
    .fromto span{display:block;font-size:.68rem;font-weight:500;color:#8fa3b8}
    .etas{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;justify-content:center}
    .eta{display:flex;align-items:center;gap:10px;background:#151c28;border-radius:10px;padding:10px 12px}
    .eta.first{background:#1a2d42;box-shadow:inset 0 0 0 1px rgba(80,150,220,.25)}
    .seq{width:20px;height:20px;border-radius:6px;background:#2a3548;color:#8fa3b8;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .eta.first .seq{background:#3d8fd1;color:#fff}
    .time{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.8em}
    .mins{font-size:1rem;font-weight:800;color:#5dce7a;margin-left:auto;white-space:nowrap}
    .eta.first .mins{color:#7ec8ff}
    .dest{font-size:.72rem;color:#8eb8d8;margin-left:6px;white-space:nowrap}
    .empty{flex:1;display:flex;align-items:center;justify-content:center;color:#6b7f94;font-size:.88rem;padding:8px}
    .bottom{display:flex;justify-content:space-between;align-items:center;background:#1c2533;border-radius:12px;padding:10px 14px;font-size:.72rem;color:#8fa3b8;flex-shrink:0}
    .btn{border:none;color:#c5d4e5;font-size:.75rem;font-weight:600;padding:6px 14px;border-radius:8px;background:#2a3548}
  </style>
</head>
<body>
  <header class="top">
    <div>
      <div class="title">天水圍 ⇄ 上水</div>
      <div class="sub">返工上行 · 放工下行</div>
    </div>
    <div class="right">
      <div class="clock" id="clock">00:00:00</div>
      <div class="meta"><span id="date">—</span> · <span id="weather-icon">🌤</span> <span id="temp">--°C</span></div>
    </div>
  </header>
  <div class="body">
    <div class="section">
      <div class="sec-label">返工 · 去上水</div>
      <div class="cards">
        <section class="card">
          <div class="head">
            <div class="route-left">
              <div class="route-row"><span class="badge">九巴</span><span class="rnum">276B</span></div>
              <div class="terminus">總站：上水（彩園）</div>
            </div>
            <div class="fromto"><span>由 濕地公園</span>→ 上水站</div>
          </div>
          <div class="etas" id="b276b_o"><div class="empty">載入中...</div></div>
        </section>
        <section class="card">
          <div class="head">
            <div class="route-left">
              <div class="route-row"><span class="badge">九巴</span><span class="rnum">276A</span></div>
              <div class="terminus">總站：上水（太平）</div>
            </div>
            <div class="fromto"><span>由 天恆</span>→ 上水站</div>
          </div>
          <div class="etas" id="b276a_o"><div class="empty">載入中...</div></div>
        </section>
      </div>
    </div>
    <div class="section">
      <div class="sec-label off">放工 · 返天水圍</div>
      <div class="cards">
        <section class="card">
          <div class="head">
            <div class="route-left">
              <div class="route-row"><span class="badge">九巴</span><span class="rnum">276A</span></div>
              <div class="terminus">總站：天恆邨</div>
            </div>
            <div class="fromto"><span>由 上水</span>→ 天澤</div>
          </div>
          <div class="etas" id="b276a_i"><div class="empty">載入中...</div></div>
        </section>
        <section class="card">
          <div class="head">
            <div class="route-left">
              <div class="route-row"><span class="badge">九巴</span><span class="rnum">276B</span></div>
              <div class="terminus">總站：天富</div>
            </div>
            <div class="fromto"><span>由 上水</span>→ 濕地公園</div>
          </div>
          <div class="etas" id="b276b_i"><div class="empty">載入中...</div></div>
        </section>
      </div>
    </div>
  </div>
  <footer class="bottom">
    <span id="status">更新中...</span>
    <button class="btn" onclick="fetchAll()">↻ 更新</button>
  </footer>
  <script>
    const weekdays=['日','一','二','三','四','五','六'];
    const JOURNEY = {
      '276B_o': { mins: 40, label: '上水' },
      '276A_o': { mins: 42, label: '上水' },
      '276A_i': { mins: 38, label: '天澤' },
      '276B_i': { mins: 40, label: '濕地公園' }
    };
    function updateClock(){
      const now=new Date();
      document.getElementById('clock').textContent=now.toTimeString().slice(0,8);
      const m=String(now.getMonth()+1).padStart(2,'0');
      const d=String(now.getDate()).padStart(2,'0');
      document.getElementById('date').textContent=m+'/'+d+' 週'+weekdays[now.getDay()];
    }
    setInterval(updateClock,1000);updateClock();
    async function fetchWeather(){
      try{
        const res=await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data=await res.json();
        if(data.temperature&&data.temperature.data){
          const t=data.temperature.data.find(x=>x.place==='濕地公園'||x.place==='元朗')||data.temperature.data[0];
          document.getElementById('temp').textContent=t.value+'°C';
        }
        if(data.icon&&data.icon[0]){
          const icon=data.icon[0];
          document.getElementById('weather-icon').textContent=icon<=2?'☀️':icon<=6?'⛅':icon<=10?'☁️':icon<=14?'🌧':'🌤';
        }
      }catch(e){}
    }
    fetchWeather();setInterval(fetchWeather,300000);
    function fmt(etaStr, journeyMins){
      if(!etaStr)return null;
      const eta=new Date(etaStr),diff=Math.floor((eta-new Date())/60000);
      if(diff<-1)return null;
      const time=eta.toTimeString().slice(0,5);
      let alight=null;
      if(journeyMins>0) alight=new Date(eta.getTime()+journeyMins*60000).toTimeString().slice(0,5);
      return{time,mins:diff<=0?'即將到':diff+' 分',alight};
    }
    function render(id,items,opt={}){
      const el=document.getElementById(id);
      if(!items||!items.length){el.innerHTML='<div class="empty">暫無班次</div>';return}
      let html='',c=0;
      for(const it of items){
        const f=fmt(it.eta,opt.journey||0);if(!f||c>=2)continue;
        const d=f.alight?`<span class="dest">落車 ${opt.destLabel} ${f.alight}</span>`:'';
        html+=`<div class="eta ${c===0?'first':''}"><div class="seq">${c+1}</div><div class="time">${f.time}</div><div class="mins">${f.mins}</div>${d}</div>`;
        c++;
      }
      el.innerHTML=html||'<div class="empty">暫無班次</div>';
    }
    async function fetchAll(){
      document.getElementById('status').textContent='更新中...';
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4C86E1F44AE9C25B');
        const j=await r.json();
        render('b276b_o',(j.data||[]).filter(i=>i.route==='276B'&&i.dir==='O'&&i.eta),
          {journey:JOURNEY['276B_o'].mins,destLabel:JOURNEY['276B_o'].label});
      }catch(e){document.getElementById('b276b_o').innerHTML='<div class="empty">無法取得</div>'}
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/A22733425D08E68A');
        const j=await r.json();
        render('b276a_o',(j.data||[]).filter(i=>i.route==='276A'&&i.dir==='O'&&i.eta),
          {journey:JOURNEY['276A_o'].mins,destLabel:JOURNEY['276A_o'].label});
      }catch(e){document.getElementById('b276a_o').innerHTML='<div class="empty">無法取得</div>'}
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4E655B25ABAE103A');
        const j=await r.json();
        const list=j.data||[];
        render('b276a_i',list.filter(i=>i.route==='276A'&&i.dir==='I'&&i.eta),
          {journey:JOURNEY['276A_i'].mins,destLabel:JOURNEY['276A_i'].label});
        render('b276b_i',list.filter(i=>i.route==='276B'&&i.dir==='I'&&i.eta),
          {journey:JOURNEY['276B_i'].mins,destLabel:JOURNEY['276B_i'].label});
      }catch(e){
        document.getElementById('b276a_i').innerHTML='<div class="empty">無法取得</div>';
        document.getElementById('b276b_i').innerHTML='<div class="empty">無法取得</div>';
      }
      document.getElementById('status').textContent='已更新 '+new Date().toTimeString().slice(0,8);
    }
    fetchAll();setInterval(fetchAll,15000);
  </script>
</body>
</html>
