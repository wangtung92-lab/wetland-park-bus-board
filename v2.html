<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="天水圍上水">
  <title>天水圍 ⇄ 上水</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#121820;color:#e8eef6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
    body{display:flex;flex-direction:column;padding:8px 10px 10px;gap:6px;height:100%}
    .top{background:#1c2533;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .title{font-size:1.2rem;font-weight:900;letter-spacing:0.3px}
    .sub{font-size:.65rem;color:#8fa3b8;margin-top:2px}
    .right{text-align:right}
    .clock{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
    .meta{font-size:.7rem;color:#7ec8ff;margin-top:2px}
    .cards{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:hidden}
    .card{background:#1c2533;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;border-left:3px solid #4a90d9}
    .card.kmb{border-left-color:#e84a5f}
    .card.mtr{border-left-color:#6b4fbb}
    .head{padding:5px 9px 4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .route-left{display:flex;align-items:center;gap:5px}
    .badge{font-size:.55rem;font-weight:800;padding:2px 5px;border-radius:4px}
    .badge.kmb{background:#e84a5f;color:#fff}
    .badge.mtr{background:#6b4fbb;color:#fff}
    .rnum{font-size:1.05rem;font-weight:900;line-height:1}
    .card.kmb .rnum{color:#ff6b7a}
    .card.mtr .rnum{color:#b39ddb}
    .fromto{font-size:.68rem;color:#c5d4e5;text-align:right;line-height:1.2}
    .etas{padding:0 7px 6px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
    .eta{display:flex;align-items:center;gap:6px;background:#151c28;border-radius:7px;padding:5px 8px}
    .eta.first{background:#1a2d42;box-shadow:inset 0 0 0 1px rgba(80,150,220,.22)}
    .seq{width:16px;height:16px;border-radius:4px;background:#2a3548;color:#8fa3b8;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .eta.first .seq{background:#3d8fd1;color:#fff}
    .time{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.6em}
    .mins{font-size:.82rem;font-weight:800;color:#5dce7a;margin-left:auto;white-space:nowrap}
    .eta.first .mins{color:#7ec8ff}
    .empty{flex:1;display:flex;align-items:center;justify-content:center;color:#6b7f94;font-size:.75rem;padding:4px}
    .bottom{display:flex;justify-content:space-between;align-items:center;background:#1c2533;border-radius:10px;padding:6px 11px;font-size:.68rem;color:#8fa3b8;flex-shrink:0}
    .btn{border:none;color:#c5d4e5;font-size:.7rem;font-weight:600;padding:4px 11px;border-radius:7px;background:#2a3548}
  </style>
</head>
<body>
  <header class="top">
    <div>
      <div class="title">天水圍 ⇄ 上水</div>
      <div class="sub">276A · 276B · 東鐵</div>
    </div>
    <div class="right">
      <div class="clock" id="clock">00:00:00</div>
      <div class="meta"><span id="date">—</span> · <span id="weather-icon">🌤</span> <span id="temp">--°C</span></div>
    </div>
  </header>
  <main class="cards">
    <section class="card kmb">
      <div class="head">
        <div class="route-left"><span class="badge kmb">九巴</span><span class="rnum">276B</span></div>
        <div class="fromto">濕地公園 → 上水</div>
      </div>
      <div class="etas" id="b276b_o"><div class="empty">…</div></div>
    </section>
    <section class="card kmb">
      <div class="head">
        <div class="route-left"><span class="badge kmb">九巴</span><span class="rnum">276A</span></div>
        <div class="fromto">天恆 → 上水</div>
      </div>
      <div class="etas" id="b276a_o"><div class="empty">…</div></div>
    </section>
    <section class="card mtr">
      <div class="head">
        <div class="route-left"><span class="badge mtr">東鐵</span><span class="rnum">上水</span></div>
        <div class="fromto">上水 → 粉嶺</div>
      </div>
      <div class="etas" id="eal_shs"><div class="empty">…</div></div>
    </section>
    <section class="card mtr">
      <div class="head">
        <div class="route-left"><span class="badge mtr">東鐵</span><span class="rnum">粉嶺</span></div>
        <div class="fromto">粉嶺 → 上水</div>
      </div>
      <div class="etas" id="eal_fan"><div class="empty">…</div></div>
    </section>
    <section class="card kmb">
      <div class="head">
        <div class="route-left"><span class="badge kmb">九巴</span><span class="rnum">276A</span></div>
        <div class="fromto">上水 → 天澤</div>
      </div>
      <div class="etas" id="b276a_i"><div class="empty">…</div></div>
    </section>
    <section class="card kmb">
      <div class="head">
        <div class="route-left"><span class="badge kmb">九巴</span><span class="rnum">276B</span></div>
        <div class="fromto">上水 → 濕地公園</div>
      </div>
      <div class="etas" id="b276b_i"><div class="empty">…</div></div>
    </section>
  </main>
  <footer class="bottom">
    <span id="status">更新中...</span>
    <button class="btn" onclick="fetchAll()">↻ 更新</button>
  </footer>
  <script>
    const weekdays=['日','一','二','三','四','五','六'];
    function updateClock(){
      const now=new Date();
      document.getElementById('clock').textContent=now.toTimeString().slice(0,8);
      const m=String(now.getMonth()+1).padStart(2,'0');
      const d=String(now.getDate()).padStart(2,'0');
      document.getElementById('date').textContent=m+'/'+d+' 週'+weekdays[now.getDay()];
    }
    setInterval(updateClock,1000);updateClock();
    async function fetchWeather(){
      try{
        const res=await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data=await res.json();
        if(data.temperature&&data.temperature.data){
          const t=data.temperature.data.find(x=>x.place==='濕地公園'||x.place==='元朗')||data.temperature.data[0];
          document.getElementById('temp').textContent=t.value+'°C';
        }
        if(data.icon&&data.icon[0]){
          const icon=data.icon[0];
          document.getElementById('weather-icon').textContent=icon<=2?'☀️':icon<=6?'⛅':icon<=10?'☁️':icon<=14?'🌧':'🌤';
        }
      }catch(e){}
    }
    fetchWeather();setInterval(fetchWeather,300000);
    function fmt(etaStr){
      if(!etaStr)return null;
      const eta=new Date(etaStr),diff=Math.floor((eta-new Date())/60000);
      if(diff<-1)return null;
      return{time:eta.toTimeString().slice(0,5),mins:diff<=0?'即將到':diff+' 分'};
    }
    function render(id,items){
      const el=document.getElementById(id);
      if(!items||!items.length){el.innerHTML='<div class="empty">暫無班次</div>';return}
      let html='',c=0;
      for(const it of items){
        const f=fmt(it.eta);if(!f||c>=1)continue;
        html+=`<div class="eta ${c===0?'first':''}"><div class="seq">${c+1}</div><div class="time">${f.time}</div><div class="mins">${f.mins}</div></div>`;
        c++;
      }
      el.innerHTML=html||'<div class="empty">暫無班次</div>';
    }
    function renderMtr(id,list){
      const el=document.getElementById(id);
      const arr=list||[];
      if(!arr.length){el.innerHTML='<div class="empty">暫無班次</div>';return}
      let html='';
      for(const t of arr.slice(0,1)){
        const mins=parseInt(t.ttnt,10);
        const time=t.time?t.time.slice(11,16):'—';
        const label=isNaN(mins)||mins<=0?'即將到':mins+' 分';
        html+=`<div class="eta first"><div class="seq">1</div><div class="time">${time}</div><div class="mins">${label}</div></div>`;
      }
      el.innerHTML=html||'<div class="empty">暫無班次</div>';
    }
    async function fetchAll(){
      document.getElementById('status').textContent='更新中...';
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4C86E1F44AE9C25B');
        const j=await r.json();
        render('b276b_o',(j.data||[]).filter(i=>i.route==='276B'&&i.dir==='O'));
      }catch(e){document.getElementById('b276b_o').innerHTML='<div class="empty">—</div>'}
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/A22733425D08E68A');
        const j=await r.json();
        render('b276a_o',(j.data||[]).filter(i=>i.route==='276A'&&i.dir==='O'));
      }catch(e){document.getElementById('b276a_o').innerHTML='<div class="empty">—</div>'}
      try{
        const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4E655B25ABAE103A');
        const j=await r.json();
        const list=j.data||[];
        render('b276a_i',list.filter(i=>i.route==='276A'&&i.dir==='I'));
        render('b276b_i',list.filter(i=>i.route==='276B'&&i.dir==='I'));
      }catch(e){
        document.getElementById('b276a_i').innerHTML='<div class="empty">—</div>';
        document.getElementById('b276b_i').innerHTML='<div class="empty">—</div>';
      }
      try{
        const r=await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=EAL&sta=SHS');
        const j=await r.json();
        renderMtr('eal_shs',(j.data&&j.data['EAL-SHS']&&j.data['EAL-SHS'].DOWN)||[]);
      }catch(e){document.getElementById('eal_shs').innerHTML='<div class="empty">—</div>'}
      try{
        const r=await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=EAL&sta=FAN');
        const j=await r.json();
        renderMtr('eal_fan',(j.data&&j.data['EAL-FAN']&&j.data['EAL-FAN'].UP)||[]);
      }catch(e){document.getElementById('eal_fan').innerHTML='<div class="empty">—</div>'}
      document.getElementById('status').textContent='已更新 '+new Date().toTimeString().slice(0,8);
    }
    fetchAll();setInterval(fetchAll,15000);
  </script>
</body>
</html>
