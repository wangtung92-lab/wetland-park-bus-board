<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="濕地公園路站">
  <title>濕地公園路站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #121820;
      color: #e8eef6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 10px 12px 12px;
      gap: 8px;
      height: 100%;
    }
    .top {
      background: #1c2533;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .station { display: flex; align-items: center; gap: 10px; }
    .bus-icon {
      width: 38px; height: 38px;
      background: #2a3548;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .station-name { font-size: 1rem; font-weight: 800; color: #f2f6fc; letter-spacing: 0.2px; }
    .station-sub { font-size: 0.68rem; color: #8fa3b8; margin-top: 1px; }
    .right-info { text-align: right; }
    .clock {
      font-size: 1.4rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f2f6fc; line-height: 1.15;
      letter-spacing: 0.5px;
    }
    .weather { font-size: 0.78rem; color: #7ec8ff; margin-top: 2px; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }
    .card {
      background: #1c2533;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      border-left: 4px solid transparent;
    }
    .card.ctb { border-left-color: #f0c000; }
    .card.kmb { border-left-color: #e84a5f; }
    .card-head {
      padding: 10px 12px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .route-left { display: flex; align-items: center; gap: 8px; }
    .op-badge {
      font-size: 0.62rem; font-weight: 800;
      padding: 3px 7px; border-radius: 6px;
      letter-spacing: 0.3px;
    }
    .op-badge.ctb { background: #f0c000; color: #1a1400; }
    .op-badge.kmb { background: #e84a5f; color: #fff; }
    .route-num {
      font-size: 1.55rem; font-weight: 900; line-height: 1;
      letter-spacing: -0.5px;
    }
    .card.ctb .route-num { color: #f0c000; }
    .card.kmb .route-num { color: #ff6b7a; }
    .dest-name {
      font-size: 0.88rem; font-weight: 600;
      color: #c5d4e5; text-align: right;
    }
    .eta-list {
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      justify-content: flex-start;
      min-height: 0;
    }
    .eta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #151c28;
      border-radius: 10px;
      padding: 9px 11px;
    }
    .eta-item.first {
      background: #1a2d42;
      box-shadow: inset 0 0 0 1px rgba(80,150,220,0.25);
    }
    .eta-seq {
      width: 20px; height: 20px; border-radius: 6px;
      background: #2a3548; color: #8fa3b8;
      font-size: 0.68rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .eta-item.first .eta-seq { background: #3d8fd1; color: #fff; }
    .eta-time {
      font-size: 1.05rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f2f6fc;
      min-width: 3.2em;
    }
    .eta-mins {
      font-size: 1rem; font-weight: 800;
      color: #5dce7a;
      margin-left: auto;
      white-space: nowrap;
    }
    .eta-item.first .eta-mins { color: #7ec8ff; }
    .eta-dest {
      font-size: 0.7rem; color: #8eb8d8;
      white-space: nowrap;
      margin-left: 6px;
    }
    .empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: #6b7f94;
      font-size: 0.88rem;
      padding: 12px;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2533;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.72rem;
      color: #8fa3b8;
      flex-shrink: 0;
    }
    .btn {
      border: none;
      color: #c5d4e5;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      background: #2a3548;
    }
    .btn:active { background: #354860; }
  </style>
</head>
<body>
  <header class="top">
    <div class="station">
      <div class="bus-icon">🚌</div>
      <div>
        <div class="station-name">濕地公園路站</div>
        <div class="station-sub">天水圍</div>
      </div>
    </div>
    <div class="right-info">
      <div class="clock" id="clock">00:00:00</div>
      <div class="weather"><span id="weather-icon">🌤</span> <span id="temp">--°C</span> · <span id="humidity">--%</span></div>
    </div>
  </header>
  <main class="cards">
    <section class="card ctb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge ctb">城巴</span>
          <span class="route-num">967</span>
        </div>
        <div class="dest-name">金鐘 (西)</div>
      </div>
      <div class="eta-list" id="eta-967"><div class="empty">載入中...</div></div>
    </section>
    <section class="card kmb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge kmb">九巴</span>
          <span class="route-num">69</span>
        </div>
        <div class="dest-name">元朗 (德業街)</div>
      </div>
      <div class="eta-list" id="eta-69"><div class="empty">載入中...</div></div>
    </section>
    <section class="card kmb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge kmb">九巴</span>
          <span class="route-num">276B</span>
        </div>
        <div class="dest-name">上水 (彩園)</div>
      </div>
      <div class="eta-list" id="eta-276b"><div class="empty">載入中...</div></div>
    </section>
  </main>
  <footer class="bottom">
    <span id="status">更新中...</span>
    <button class="btn" onclick="fetchData()">↻ 更新</button>
  </footer>
  <script>
    const JOURNEY = { '967': 52, '276B': 40 };
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toTimeString().substring(0, 8);
    }
    setInterval(updateClock, 1000);
    updateClock();
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        if (data.temperature?.data) {
          const t = data.temperature.data.find(x => x.place === '濕地公園' || x.place === '元朗') || data.temperature.data[0];
          document.getElementById('temp').textContent = t.value + '°C';
        }
        if (data.humidity?.data) document.getElementById('humidity').textContent = data.humidity.data[0].value + '%';
        if (data.icon?.[0]) {
          const icon = data.icon[0];
          document.getElementById('weather-icon').textContent =
            icon <= 2 ? '☀️' : icon <= 6 ? '⛅' : icon <= 10 ? '☁️' : icon <= 14 ? '🌧' : '🌤';
        }
      } catch (e) {}
    }
    fetchWeather();
    setInterval(fetchWeather, 300000);
    function formatEta(etaStr, journeyMins = 0) {
      if (!etaStr) return null;
      const eta = new Date(etaStr);
      const diff = Math.floor((eta - new Date()) / 60000);
      if (diff < -1) return null;
      const time = eta.toTimeString().substring(0, 5);
      let destTime = null;
      if (journeyMins > 0) {
        destTime = new Date(eta.getTime() + journeyMins * 60000).toTimeString().substring(0, 5);
      }
      if (diff <= 0) return { time, mins: '即將到', destTime };
      return { time, mins: diff + ' 分', destTime };
    }
    function renderList(containerId, items, options = {}) {
      const el = document.getElementById(containerId);
      if (!items || items.length === 0) {
        el.innerHTML = '<div class="empty">暫無班次</div>';
        return;
      }
      let html = '';
      let count = 0;
      for (const item of items) {
        const f = formatEta(item.eta, options.journey || 0);
        if (!f || count >= 2) continue;
        const isFirst = count === 0;
        const destHtml = f.destTime ? `<span class="eta-dest">→ ${options.destLabel} ${f.destTime}</span>` : '';
        html += `<div class="eta-item ${isFirst ? 'first' : ''}">
          <div class="eta-seq">${count + 1}</div>
          <div class="eta-time">${f.time}</div>
          <div class="eta-mins">${f.mins}</div>
          ${destHtml}
        </div>`;
        count++;
      }
      el.innerHTML = html || '<div class="empty">暫無班次</div>';
    }
    async function fetchData() {
      document.getElementById('status').textContent = '更新中...';
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002622/967');
        const json = await res.json();
        const list = (json.data || []).filter(i => i.dir === 'O' || (i.dest_tc && i.dest_tc.includes('金鐘')));
        renderList('eta-967', list, { journey: JOURNEY['967'], destLabel: '大會堂' });
      } catch (e) {
        document.getElementById('eta-967').innerHTML = '<div class="empty">無法取得</div>';
      }
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4C86E1F44AE9C25B');
        const json = await res.json();
        const list = json.data || [];
        renderList('eta-69', list.filter(i => i.route === '69' && i.dir === 'O'));
        renderList('eta-276b', list.filter(i => i.route === '276B' && i.dir === 'O'),
          { journey: JOURNEY['276B'], destLabel: '上水' });
      } catch (e) {
        document.getElementById('eta-69').innerHTML = '<div class="empty">無法取得</div>';
        document.getElementById('eta-276b').innerHTML = '<div class="empty">無法取得</div>';
      }
      document.getElementById('status').textContent = '已更新 ' + new Date().toTimeString().substring(0, 8);
    }
    fetchData();
    setInterval(fetchData, 15000);
  </script>
</body>
</html>
