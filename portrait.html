<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="濕地公園路站">
  <title>濕地公園路站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1a2332;
      color: #e8eef6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 8px 10px 10px;
      gap: 6px;
      height: 100%;
    }
    .top {
      background: linear-gradient(180deg, #243044 0%, #1e2a3a 100%);
      border: 1px solid rgba(140,170,210,0.14);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .station { display: flex; align-items: center; gap: 8px; }
    .bus-icon {
      width: 32px; height: 32px;
      background: #2c3b52;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .station-name { font-size: 0.95rem; font-weight: 800; color: #f0f5fb; }
    .station-sub { font-size: 0.65rem; color: #9aafc4; }
    .right-info { text-align: right; }
    .clock { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #f0f5fb; line-height: 1.1; }
    .weather { font-size: 0.75rem; color: #7ec8ff; margin-top: 1px; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }
    .card {
      background: linear-gradient(165deg, #243044 0%, #1e2a3a 100%);
      border: 1px solid rgba(140,170,210,0.13);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
    }
    .card.ctb::before { background: #f0c000; }
    .card.kmb::before { background: #e84a5f; }
    .card-head {
      padding: 7px 10px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(140,170,210,0.1);
      flex-shrink: 0;
    }
    .route-left { display: flex; align-items: center; gap: 6px; }
    .op-badge {
      font-size: 0.6rem; font-weight: 800;
      padding: 2px 6px; border-radius: 4px;
    }
    .op-badge.ctb { background: #f0c000; color: #1a1a1a; }
    .op-badge.kmb { background: #e84a5f; color: #fff; }
    .route-num { font-size: 1.4rem; font-weight: 900; line-height: 1; }
    .card.ctb .route-num { color: #f0c000; }
    .card.kmb .route-num { color: #ff6b7a; }
    .dest-name { font-size: 0.85rem; font-weight: 700; color: #f0f5fb; text-align: right; }
    .eta-list {
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: center;
      min-height: 0;
    }
    .eta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(140,170,210,0.08);
      border-radius: 8px;
      padding: 6px 9px;
    }
    .eta-item.first {
      background: rgba(80,150,220,0.14);
      border-color: rgba(80,150,220,0.35);
    }
    .eta-seq {
      width: 18px; height: 18px; border-radius: 5px;
      background: #2c3b52; color: #9aafc4;
      font-size: 0.65rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .eta-item.first .eta-seq { background: #3d8fd1; color: #fff; }
    .eta-time { font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; }
    .eta-mins { font-size: 0.95rem; font-weight: 800; color: #5dce7a; white-space: nowrap; }
    .eta-item.first .eta-mins { color: #7ec8ff; }
    .eta-dest { font-size: 0.62rem; color: #9ad0ff; margin-left: 4px; white-space: nowrap; }
    .empty {
      padding: 10px;
      text-align: center;
      color: #7a90a8;
      font-size: 0.85rem;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e2a3a;
      border: 1px solid rgba(140,170,210,0.12);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.7rem;
      color: #9aafc4;
      flex-shrink: 0;
    }
    .btn {
      border: 1px solid rgba(140,170,210,0.15);
      color: #c5d4e5;
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 7px;
      background: #2c3b52;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="station">
      <div class="bus-icon">🚌</div>
      <div>
        <div class="station-name">濕地公園路站</div>
        <div class="station-sub">天水圍</div>
      </div>
    </div>
    <div class="right-info">
      <div class="clock" id="clock">00:00:00</div>
      <div class="weather"><span id="weather-icon">🌤</span> <span id="temp">--°C</span> · <span id="humidity">--%</span></div>
    </div>
  </header>
  <main class="cards">
    <section class="card ctb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge ctb">城巴</span>
          <span class="route-num">967</span>
        </div>
        <div class="dest-name">金鐘 (西)</div>
      </div>
      <div class="eta-list" id="eta-967"><div class="empty">載入中...</div></div>
    </section>
    <section class="card kmb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge kmb">九巴</span>
          <span class="route-num">69</span>
        </div>
        <div class="dest-name">元朗 (德業街)</div>
      </div>
      <div class="eta-list" id="eta-69"><div class="empty">載入中...</div></div>
    </section>
    <section class="card kmb">
      <div class="card-head">
        <div class="route-left">
          <span class="op-badge kmb">九巴</span>
          <span class="route-num">276B</span>
        </div>
        <div class="dest-name">上水 (彩園)</div>
      </div>
      <div class="eta-list" id="eta-276b"><div class="empty">載入中...</div></div>
    </section>
  </main>
  <footer class="bottom">
    <span id="status">更新中...</span>
    <button class="btn" onclick="fetchData()">↻ 更新</button>
  </footer>
  <script>
    const JOURNEY = { '967': 52, '276B': 40 };
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toTimeString().substring(0, 8);
    }
    setInterval(updateClock, 1000);
    updateClock();
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        if (data.temperature?.data) {
          const t = data.temperature.data.find(x => x.place === '濕地公園' || x.place === '元朗') || data.temperature.data[0];
          document.getElementById('temp').textContent = t.value + '°C';
        }
        if (data.humidity?.data) document.getElementById('humidity').textContent = data.humidity.data[0].value + '%';
        if (data.icon?.[0]) {
          const icon = data.icon[0];
          document.getElementById('weather-icon').textContent =
            icon <= 2 ? '☀️' : icon <= 6 ? '⛅' : icon <= 10 ? '☁️' : icon <= 14 ? '🌧' : '🌤';
        }
      } catch (e) {}
    }
    fetchWeather();
    setInterval(fetchWeather, 300000);
    function formatEta(etaStr, journeyMins = 0) {
      if (!etaStr) return null;
      const eta = new Date(etaStr);
      const diff = Math.floor((eta - new Date()) / 60000);
      if (diff < -1) return null;
      const time = eta.toTimeString().substring(0, 5);
      let destTime = null;
      if (journeyMins > 0) {
        destTime = new Date(eta.getTime() + journeyMins * 60000).toTimeString().substring(0, 5);
      }
      if (diff <= 0) return { time, mins: '即將到', destTime };
      return { time, mins: diff + ' 分', destTime };
    }
    function renderList(containerId, items, options = {}) {
      const el = document.getElementById(containerId);
      if (!items || items.length === 0) {
        el.innerHTML = '<div class="empty">暫無班次</div>';
        return;
      }
      let html = '';
      let count = 0;
      for (const item of items) {
        const f = formatEta(item.eta, options.journey || 0);
        if (!f || count >= 2) continue;
        const isFirst = count === 0;
        const destHtml = f.destTime ? `<span class="eta-dest">→${options.destLabel} ${f.destTime}</span>` : '';
        html += `<div class="eta-item ${isFirst ? 'first' : ''}">
          <div class="eta-seq">${count + 1}</div>
          <div class="eta-time">${f.time}</div>
          <div class="eta-mins">${f.mins}</div>
          ${destHtml}
        </div>`;
        count++;
      }
      el.innerHTML = html || '<div class="empty">暫無班次</div>';
    }
    async function fetchData() {
      document.getElementById('status').textContent = '更新中...';
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002622/967');
        const json = await res.json();
        const list = (json.data || []).filter(i => i.dir === 'O' || (i.dest_tc && i.dest_tc.includes('金鐘')));
        renderList('eta-967', list, { journey: JOURNEY['967'], destLabel: '大會堂' });
      } catch (e) {
        document.getElementById('eta-967').innerHTML = '<div class="empty">無法取得</div>';
      }
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/4C86E1F44AE9C25B');
        const json = await res.json();
        const list = json.data || [];
        renderList('eta-69', list.filter(i => i.route === '69' && i.dir === 'O'));
        renderList('eta-276b', list.filter(i => i.route === '276B' && i.dir === 'O'),
          { journey: JOURNEY['276B'], destLabel: '上水' });
      } catch (e) {
        document.getElementById('eta-69').innerHTML = '<div class="empty">無法取得</div>';
        document.getElementById('eta-276b').innerHTML = '<div class="empty">無法取得</div>';
      }
      document.getElementById('status').textContent = '已更新 ' + new Date().toTimeString().substring(0, 8);
    }
    fetchData();
    setInterval(fetchData, 15000);
  </script>
</body>
</html>
